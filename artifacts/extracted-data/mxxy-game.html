<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MXXY 离线版 - 洗炼·合宠·打书</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#080818;color:#c8c8d0;min-height:100vh}
.topbar{background:#0d0d28;border-bottom:1px solid #2a2a4a;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.topbar h1{font-size:20px;color:#ffd700}
.topbar .btns{display:flex;gap:8px}
.topbar button{padding:8px 16px;border:1px solid #444;border-radius:6px;background:#1a1a3e;color:#ccc;cursor:pointer;font-size:12px}
.topbar button:hover{background:#2a2a5e;border-color:#ffd700}
.topbar button.active{background:#3a2a1e;border-color:#fa0;color:#fa0}
.main{max-width:1400px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{padding:10px 24px;border:1px solid #333;border-radius:8px 8px 0 0;background:#101028;color:#888;cursor:pointer;font-size:13px}
.tab.sel{background:#1a1a3e;color:#ffd700;border-color:#ffd700;border-bottom-color:#1a1a3e}
.panel{display:none}
.panel.on{display:block}
.inventory{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pet-card{background:#101028;border:2px solid #2a2a4a;border-radius:12px;padding:16px;position:relative;cursor:pointer;transition:all .2s}
.pet-card:hover{border-color:#666}
.pet-card.selected{border-color:#ffd700;box-shadow:0 0 12px rgba(255,215,0,.2)}
.pet-card .name{font-size:17px;color:#ffd700;font-weight:bold;margin-bottom:4px}
.pet-card .type{font-size:11px;color:#888;margin-bottom:10px}
.pet-card .stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px}
.pet-card .stats .s{color:#aaa}
.pet-card .stats .v{color:#4af;text-align:right;font-weight:bold}
.pet-card .skills{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.pet-card .skill-tag{display:inline-flex;align-items:center;gap:4px;background:#1a1a3e;border:1px solid #333;border-radius:6px;padding:3px 8px;font-size:11px}
.pet-card .skill-tag img{width:20px;height:20px;image-rendering:pixelated}
.pet-card .skill-tag .sk-name{color:#8af}
.pet-card .actions{display:flex;gap:6px;margin-top:10px}
.pet-card .actions button{padding:6px 12px;border:1px solid #444;border-radius:6px;background:#1a1a3e;color:#ccc;cursor:pointer;font-size:11px;flex:1}
.pet-card .actions button:hover{background:#2a2a5e}
.pet-card .actions button.gold{background:#3a2a0a;border-color:#a80;color:#fa0}
.pet-card .actions button.red{background:#3a0a0a;border-color:#a00;color:#f44}
.pet-card .rare{position:absolute;top:8px;right:8px;font-size:10px;padding:2px 8px;border-radius:4px}
.rare-ssr{background:#300;color:#f44;border:1px solid #600}
.rare-sr{background:#230;color:#a4f;border:1px solid #406}
.rare-r{background:#032;color:#4af;border:1px solid #046}
.rare-n{background:#222;color:#888}
.fusion-area{display:flex;gap:20px;align-items:center;justify-content:center;padding:30px;flex-wrap:wrap}
.fusion-slot{width:280px;min-height:300px;border:2px dashed #333;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#555;font-size:14px;padding:20px}
.fusion-slot.filled{border-color:#666;border-style:solid}
.fusion-plus{font-size:40px;color:#666}
.fusion-equals{font-size:40px;color:#ffd700}
.result-card{background:#1a1a0a;border:2px solid #3a3a1a;border-radius:16px;padding:24px;text-align:center;min-width:280px}
.result-card h3{color:#ffd700;margin-bottom:12px}
.wash-area{text-align:center;padding:20px}
.wash-slots{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.wash-controls{text-align:center;margin:20px}
.wash-controls button{padding:12px 40px;font-size:16px;border-radius:10px;margin:0 8px}
.wash-result{margin:20px;padding:16px;background:#0a1a0a;border:1px solid #1a3a1a;border-radius:10px;display:none}
.wash-result.show{display:block}
.skill-pool{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.skill-book{background:#101028;border:1px solid #333;border-radius:8px;padding:10px;text-align:center;cursor:pointer;width:100px}
.skill-book:hover{border-color:#ffd700}
.skill-book img{width:40px;height:40px;image-rendering:pixelated}
.skill-book .sn{font-size:10px;color:#aaa;margin-top:4px}
.log-area{background:#0a0a14;border:1px solid #2a2a4a;border-radius:8px;padding:12px;max-height:200px;overflow-y:auto;font-size:11px;color:#888;margin-top:20px}
.log-area .log{margin:2px 0}
.log-area .log.good{color:#4f4}
.log-area .log.great{color:#ffd700}
.log-area .log.bad{color:#f44}
.empty-state{text-align:center;padding:60px;color:#555}
.empty-state button{padding:12px 30px;background:#1a1a3e;border:1px solid #ffd700;border-radius:8px;color:#ffd700;cursor:pointer;font-size:14px;margin-top:16px}
.stats-compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;margin:10px 0}
.stats-compare .old{color:#888}
.stats-compare .new{color:#4f4;font-weight:bold}
</style>
</head>
<body>

<div class="topbar">
  <h1>MXXY 离线版 - 洗炼·合宠·打书</h1>
  <div class="btns">
    <button onclick="saveGame()">💾 保存</button>
    <button onclick="loadGame()">📂 读取</button>
    <button onclick="resetGame()">🔄 重置</button>
    <span style="color:#888;font-size:11px;margin-left:8px" id="goldDisplay">💰 金币: 0</span>
  </div>
</div>

<div class="main">
  <div class="tabs">
    <div class="tab sel" onclick="switchTab('inventory')">📦 宠物仓库</div>
    <div class="tab" onclick="switchTab('fusion')">🧬 合宠融合</div>
    <div class="tab" onclick="switchTab('wash')">✨ 资质洗炼</div>
    <div class="tab" onclick="switchTab('skill')">📖 技能打书</div>
  </div>

  <div class="panel on" id="panel-inventory"></div>
  <div class="panel" id="panel-fusion"></div>
  <div class="panel" id="panel-wash"></div>
  <div class="panel" id="panel-skill"></div>

  <div class="log-area" id="log"></div>
</div>

<script>
// ==================== GAME DATA ====================
const PET_NAMES = ["烈阳圣龙","冰晶凤凰","暗影魔狼","雷霆战虎","碧水灵龟","疾风猎鹰","大地巨熊","幽冥鬼狐","圣光独角兽",
  "赤焰麒麟","霜月冰龙","紫电雷兽","黄金比蒙","九尾天狐","玄冥玄武","青鸾神鸟","混沌魔猿","七彩神鹿","深渊巨蟒","翡翠灵蝶"];
const SKILL_NAMES = ["烈火焚天","寒冰屏障","暗影突袭","雷霆万钧","圣光治愈","剧毒撕咬","疾风连斩","大地守护",
  "神佑复生","破甲一击","魔法反射","吸血狂击","幽冥鬼爪","天堂之拳","地狱烈焰","绝对零度","石化凝视","灵魂链接",
  "致命毒液","狂暴之力","铁壁防御","高速神言","必杀一击","偷天换日","慈航普度"];
const RARITIES = ["N","R","SR","SSR"];
const RARITY_COLORS = {SSR:"#f44",SR:"#a4f",R:"#4af",N:"#888"};
const RARITY_WEIGHTS = {SSR:3,SR:15,R:40,N:42};
const TYPES = ["🔥 火系","❄️ 冰系","🌑 暗系","⚡ 雷系","✨ 光系","🌿 自然系","💀 亡灵系","🐉 龙系"];

// ==================== GAME STATE ====================
let pets = [];
let gold = 10000;
let selectedPet = null;
let fusionSlots = [null, null];
let washTarget = null;
let skillTarget = null;

// ==================== HELPERS ====================
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function weightedPick(items,weights){
  const total = Object.values(weights).reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(const [k,w] of Object.entries(weights)){r-=w;if(r<=0)return k}
  return items[0];
}
function log(msg,cls=''){const l=document.getElementById('log');l.innerHTML+=`<div class="log ${cls}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;l.scrollTop=l.scrollHeight}

// ==================== PET DATA MODEL ====================
function genPet(name, type, rarity, parentId) {
  const baseStats = {SSR:[140,160],SR:[110,140],R:[80,110],N:[50,80]}[rarity];
  const growth = rarity==='SSR'?1.3:rarity==='SR'?1.15:rarity==='R'?1.0:0.85;

  return {
    id: Date.now().toString(36)+rand(1000,9999),
    name: name||pick(PET_NAMES),
    type: type||pick(TYPES),
    rarity: rarity||weightedPick(RARITIES, RARITY_WEIGHTS),
    level: 1,
    exp: 0,
    // 22-field schema from infobeast.lua
    LIFE: rand(baseStats[0],baseStats[1]),
    MERIT: rand(60,100),
    FIGHT_GRADE: rand(1,5),
    GROWUP: +(growth*100).toFixed(0),
    TZZZ: rand(60,100),   // 体质资质
    WGZZ: rand(60,100),   // 物攻资质
    FGZZ: rand(60,100),   // 法攻资质
    WFZZ: rand(60,100),   // 物防资质
    SDZZ: rand(60,100),   // 速度资质
    BASE_SKILLS: [],
    SKILLS: [],
    FROM: parentId||null,
    generation: 0
  };
}

function getPetStats(p){
  const g = p.GROWUP/100;
  return {
    HP: Math.floor(p.LIFE * g * (0.9 + p.TZZZ/500)),
    ATK: Math.floor(p.WGZZ * g * (0.8 + p.MERIT/500)),
    MATK: Math.floor(p.FGZZ * g * (0.8 + p.MERIT/500)),
    DEF: Math.floor(p.WFZZ * g * (0.8 + p.MERIT/500)),
    SPD: Math.floor(p.SDZZ * g * (0.9 + p.MERIT/500)),
  };
}

// ==================== PET GENERATION ====================
function createStarterPets(n=5) {
  for(let i=0;i<n;i++){
    const r = i===0?'SR':i===1?'SR':weightedPick(RARITIES,RARITY_WEIGHTS);
    const p = genPet(null,null,r,null);
    // Give 1-2 random starter skills
    const skillCount = r==='SSR'?3:r==='SR'?2:1;
    for(let j=0;j<skillCount;j++){
      const sk = pick(SKILL_NAMES);
      if(!p.SKILLS.includes(sk)) p.SKILLS.push(sk);
    }
    pets.push(p);
  }
  pets[0].name = "新手龙";
  pets[0].type = "🐉 龙系";
  pets[0].rarity = "SR";
  pets[0].SKILLS = ["烈火焚天","神佑复生"];
  pets[1].name = "新手凤";
  pets[1].type = "✨ 光系";
  pets[1].rarity = "SR";
  pets[1].SKILLS = ["圣光治愈","高速神言"];
  log("获得初始宠物: "+pets[0].name+" 和 "+pets[1].name,"good");
}

// ==================== FUSION SYSTEM ====================
function fusePets(p1, p2) {
  const cost = 500;
  if(gold < cost) { log("金币不足! 需要 "+cost,"bad"); return null; }
  gold -= cost;

  // Fusion formula: child inherits from parents
  const newRarity = weightedPick(RARITIES, {
    SSR: p1.rarity==='SSR'&&p2.rarity==='SSR'?25:p1.rarity==='SSR'||p2.rarity==='SSR'?10:1,
    SR: p1.rarity==='SR'||p2.rarity==='SR'?35:20,
    R: 40,
    N: 20
  });

  const type = Math.random()<0.7 ? pick([p1.type,p2.type]) : pick(TYPES);

  const child = genPet(null, type, newRarity, [p1.id, p2.id]);
  child.generation = Math.max(p1.generation, p2.generation) + 1;

  // Inherit stats: weighted average + random perturbation
  const inherit = (a,b) => Math.floor((a+b)/2 * (0.85 + Math.random()*0.3));
  child.LIFE = inherit(p1.LIFE, p2.LIFE);
  child.TZZZ = inherit(p1.TZZZ, p2.TZZZ);
  child.WGZZ = inherit(p1.WGZZ, p2.WGZZ);
  child.FGZZ = inherit(p1.FGZZ, p2.FGZZ);
  child.WFZZ = inherit(p1.WFZZ, p2.WFZZ);
  child.SDZZ = inherit(p1.SDZZ, p2.SDZZ);
  child.MERIT = inherit(p1.MERIT, p2.MERIT);
  child.GROWUP = inherit(p1.GROWUP, p2.GROWUP);
  child.FIGHT_GRADE = Math.max(p1.FIGHT_GRADE, p2.FIGHT_GRADE);

  // Inherit skills: deduplicate + random selection
  const allSkills = [...new Set([...p1.SKILLS, ...p2.SKILLS])];
  const maxSkills = newRarity==='SSR'?5:newRarity==='SR'?4:newRarity==='R'?3:2;
  child.SKILLS = [];
  const shuffled = allSkills.sort(()=>Math.random()-0.5);
  for(let i=0;i<Math.min(maxSkills, shuffled.length);i++){
    child.SKILLS.push(shuffled[i]);
  }

  // Remove parents
  pets = pets.filter(p => p.id !== p1.id && p.id !== p2.id);
  pets.push(child);

  log(`合宠成功! ${p1.name} + ${p2.name} = <b style="color:${RARITY_COLORS[child.rarity]}">${child.name}</b> (${child.rarity}) 第${child.generation}代`,"great");
  return child;
}

// ==================== WASH SYSTEM ====================
function washPet(pet){
  const cost = pet.rarity==='SSR'?1000:pet.rarity==='SR'?500:pet.rarity==='R'?200:100;
  if(gold < cost) { log("金币不足! 需要 "+cost,"bad"); return null; }
  gold -= cost;

  const old = getPetStats(pet);
  const oldGrow = pet.GROWUP;

  // Reroll stats with slight chance of improvement
  const improvement = Math.random() < 0.3; // 30% chance of guaranteed improvement

  pet.TZZZ = improvement ? Math.min(100, pet.TZZZ + rand(1,8)) : rand(40,100);
  pet.WGZZ = improvement ? Math.min(100, pet.WGZZ + rand(1,8)) : rand(40,100);
  pet.FGZZ = improvement ? Math.min(100, pet.FGZZ + rand(1,8)) : rand(40,100);
  pet.WFZZ = improvement ? Math.min(100, pet.WFZZ + rand(1,8)) : rand(40,100);
  pet.SDZZ = improvement ? Math.min(100, pet.SDZZ + rand(1,8)) : rand(40,100);
  pet.GROWUP = improvement ? Math.min(150, pet.GROWUP + rand(1,5)) : rand(60, 120);
  pet.MERIT = Math.floor((pet.TZZZ+pet.WGZZ+pet.FGZZ+pet.WFZZ+pet.SDZZ)/5);

  const nw = getPetStats(pet);
  const changed = nw.HP - old.HP;
  const growChanged = pet.GROWUP - oldGrow;

  log(`洗炼 ${pet.name}: 生命${changed>=0?'+':''}${changed} 成长${growChanged>=0?'+':''}${growChanged} ${improvement?'✨提升!':''}`,
    improvement?'great':changed>0?'good':'');
  return {old, new:nw};
}

// ==================== SKILL TEACH SYSTEM ====================
function teachSkill(pet, skillName) {
  const cost = 300;
  if(gold < cost) { log("金币不足! 需要 "+cost,"bad"); return false; }
  if(pet.SKILLS.includes(skillName)) { log("宠物已有此技能!","bad"); return false; }

  const maxSkills = pet.rarity==='SSR'?5:pet.rarity==='SR'?4:pet.rarity==='R'?3:2;
  if(pet.SKILLS.length >= maxSkills) {
    // Need to replace a skill
    const replaced = pick(pet.SKILLS);
    pet.SKILLS = pet.SKILLS.filter(s => s !== replaced);
    pet.SKILLS.push(skillName);
    gold -= cost;
    log(`打书成功! ${pet.name} 遗忘了 "${replaced}"，学会了 <b>"${skillName}"</b>`,"great");
    return true;
  }

  pet.SKILLS.push(skillName);
  gold -= cost;
  log(`打书成功! ${pet.name} 学会了 <b>"${skillName}"</b>`,"good");
  return true;
}

// ==================== RENDER ====================
function renderAll() {
  renderInventory();
  renderFusion();
  renderWash();
  renderSkill();
  document.getElementById('goldDisplay').textContent = `💰 金币: ${gold.toLocaleString()}`;
}

function petCardHTML(p, showActions=true) {
  const s = getPetStats(p);
  const isSel = selectedPet && selectedPet.id === p.id;
  return `<div class="pet-card ${isSel?'selected':''}" onclick="selectPet('${p.id}')" id="pet-${p.id}">
    <span class="rare rare-${p.rarity.toLowerCase()}">${p.rarity}</span>
    <div class="name">${p.name} ${p.generation>0?'G'+p.generation:''}</div>
    <div class="type">${p.type} | Lv.${p.level} | 成长 ${p.GROWUP}</div>
    <div class="stats">
      <div class="s">生命</div><div class="v">${s.HP}</div>
      <div class="s">物攻</div><div class="v">${s.ATK}</div>
      <div class="s">法攻</div><div class="v">${s.MATK}</div>
      <div class="s">物防</div><div class="v">${s.DEF}</div>
      <div class="s">速度</div><div class="v">${s.SPD}</div>
      <div class="s">资质</div><div class="v">${p.MERIT}</div>
    </div>
    <div class="skills">
      ${p.SKILLS.map(sk=>`<span class="skill-tag"><span class="sk-name">${sk}</span></span>`).join('')}
      ${p.SKILLS.length===0?'<span style="color:#555;font-size:11px">无技能</span>':''}
    </div>
    ${showActions ? `
    <div class="actions">
      <button class="gold" onclick="event.stopPropagation();quickWash('${p.id}')">✨ 洗炼</button>
      <button onclick="event.stopPropagation();addToFusion('${p.id}')">🧬 合宠</button>
    </div>` : ''}
  </div>`;
}

function renderInventory() {
  const panel = document.getElementById('panel-inventory');
  if(pets.length === 0) {
    panel.innerHTML = `<div class="empty-state">
      <p style="font-size:16px;margin-bottom:8px">🐣 还没有宠物</p>
      <p style="color:#666;margin-bottom:16px">从野外捕捉或召唤获取你的第一只宠物</p>
      <button onclick="createStarterPets(5);renderAll();log('获得了5只初始宠物!','good')">🎁 领取初始宠物</button>
    </div>`;
    return;
  }
  panel.innerHTML = `<div class="inventory">${pets.map(p=>petCardHTML(p)).join('')}</div>`;
}

function renderFusion() {
  const panel = document.getElementById('panel-fusion');
  panel.innerHTML = `<div class="fusion-area">
    <div class="fusion-slot ${fusionSlots[0]?'filled':''}" onclick="clearFusionSlot(0)">
      ${fusionSlots[0] ? petCardHTML(fusionSlots[0],false).replace('selected','') : '⬆️ 点击宠物卡片选择<br><span style="font-size:11px">或点击此清除</span>'}
    </div>
    <div class="fusion-plus">+</div>
    <div class="fusion-slot ${fusionSlots[1]?'filled':''}" onclick="clearFusionSlot(1)">
      ${fusionSlots[1] ? petCardHTML(fusionSlots[1],false).replace('selected','') : '⬆️ 点击宠物卡片选择<br><span style="font-size:11px">或点击此清除</span>'}
    </div>
    <div class="fusion-equals">=</div>
    <div class="result-card">
      <h3>🧬 合宠结果预览</h3>
      ${fusionSlots[0]&&fusionSlots[1] ? `
        <p style="color:#888;margin:10px 0">${fusionSlots[0].name} (${fusionSlots[0].rarity}) + ${fusionSlots[1].name} (${fusionSlots[1].rarity})</p>
        <p style="color:#888">子代将继承双亲属性，技能随机遗传</p>
        <p style="color:#fa0;margin:10px 0">💰 费用: 500 金币</p>
        <button onclick="doFusion()" style="padding:10px 30px;background:#3a2a0a;border:2px solid #a80;border-radius:8px;color:#fa0;cursor:pointer;font-size:14px">开始合宠!</button>
      ` : '<p style="color:#555">选择两只宠物进行合宠</p>'}
    </div>
  </div>`;
}

function renderWash() {
  const panel = document.getElementById('panel-wash');
  panel.innerHTML = `<div class="wash-area">
    <h2 style="color:#ffd700">✨ 资质洗炼</h2>
    <p style="color:#888;margin:10px 0">重新随机宠物资质，有小概率触发提升!</p>
    <div class="wash-slots">
      ${washTarget ? petCardHTML(washTarget,false).replace('selected','') : '<div class="fusion-slot" onclick="switchTab(\'inventory\');log(\'点击宠物卡片选择洗炼目标\')">⬆️ 点击这里，然后切换到仓库选择宠物</div>'}
    </div>
    ${washTarget ? `
    <div class="wash-controls">
      <p style="color:#fa0;margin-bottom:10px">💰 费用: ${washTarget.rarity==='SSR'?1000:washTarget.rarity==='SR'?500:200} 金币</p>
      <button onclick="doWash()" style="padding:12px 40px;background:linear-gradient(135deg,#2a1a0a,#3a2a0a);border:2px solid #a80;border-radius:10px;color:#fa0;cursor:pointer;font-size:15px">✨ 洗炼!</button>
      <button onclick="doWashX5()" style="padding:12px 40px;background:linear-gradient(135deg,#1a0a2a,#2a1a3a);border:2px solid #a4f;border-radius:10px;color:#a4f;cursor:pointer;font-size:15px">✨ 连洗×5</button>
    </div>` : ''}
  </div>`;
}

function renderSkill() {
  const panel = document.getElementById('panel-skill');
  panel.innerHTML = `<div style="text-align:center;padding:20px">
    <h2 style="color:#ffd700">📖 技能打书</h2>
    <p style="color:#888;margin:10px 0">选择宠物学习新技能，技能满时随机替换旧技能</p>
    <div style="display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:20px">
      <div>${skillTarget ? petCardHTML(skillTarget,false).replace('selected','').replace('</div>','</div><p style="color:#fa0;margin-top:8px">💰 费用: 300 金币</p>') : '<div class="fusion-slot">⬆️ 从仓库选择宠物</div>'}</div>
    </div>
    ${skillTarget ? `
    <h3 style="color:#8af;margin:16px 0">选择要学习的技能:</h3>
    <div class="skill-pool" style="justify-content:center;max-width:800px;margin:0 auto">
      ${SKILL_NAMES.filter(s=>!skillTarget.SKILLS.includes(s)).map(s=>`
        <div class="skill-book" onclick="teachSkill(skillTarget,'${s}');renderAll()">
          <div style="font-size:24px">📖</div>
          <div class="sn">${s}</div>
        </div>
      `).join('')}
    </div>
    ${skillTarget.SKILLS.length>0?`<p style="color:#666;margin-top:12px">已有技能: ${skillTarget.SKILLS.join(' / ')}</p>`:''}
    ` : ''}
  </div>`;
}

// ==================== ACTIONS ====================
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('sel'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.querySelector(`.tab:nth-child(${{inventory:1,fusion:2,wash:3,skill:4}[tab]})`).classList.add('sel');
  document.getElementById(`panel-${tab}`).classList.add('on');
  if(tab==='inventory') selectedPet=null;
  if(tab==='fusion') {selectedPet=null;renderFusion();}
  renderAll();
}

function selectPet(id) {
  const pet = pets.find(p=>p.id===id)||null;
  selectedPet = pet;
  // Auto-set wash/skill targets based on active tab
  if(document.getElementById('panel-wash').classList.contains('on')) { washTarget = pet; switchTab('wash'); }
  if(document.getElementById('panel-skill').classList.contains('on')) { skillTarget = pet; switchTab('skill'); }
  if(document.getElementById('panel-fusion').classList.contains('on')) { addToFusion(id); return; }
  renderAll();
}

function addToFusion(id) {
  const pet = pets.find(p=>p.id===id);
  if(!pet) return;
  if(fusionSlots[0] && fusionSlots[0].id === id) { fusionSlots[0]=null; renderAll(); return; }
  if(fusionSlots[1] && fusionSlots[1].id === id) { fusionSlots[1]=null; renderAll(); return; }
  if(!fusionSlots[0]) { fusionSlots[0]=pet; log(`合宠选择: ${pet.name}`); }
  else if(!fusionSlots[1]) { fusionSlots[1]=pet; log(`合宠选择: ${pet.name}`); }
  switchTab('fusion');
}

function clearFusionSlot(i) { fusionSlots[i]=null; renderAll(); }

function doFusion() {
  if(!fusionSlots[0]||!fusionSlots[1]) return;
  const child = fusePets(fusionSlots[0], fusionSlots[1]);
  fusionSlots = [null, null];
  if(child) selectedPet = child;
  renderAll();
}

function quickWash(id) {
  const pet = pets.find(p=>p.id===id);
  if(!pet) return;
  washPet(pet);
  renderAll();
}

function doWash() {
  if(!washTarget) return;
  washPet(washTarget);
  renderAll();
}

function doWashX5() {
  if(!washTarget) return;
  for(let i=0;i<5;i++) washPet(washTarget);
  renderAll();
}

// ==================== PERSISTENCE ====================
function saveGame() {
  const data = {pets, gold, v:1};
  localStorage.setItem('mxxy_save', JSON.stringify(data));
  log("游戏已保存!","good");
}

function loadGame() {
  const raw = localStorage.getItem('mxxy_save');
  if(!raw) { log("没有存档","bad"); return; }
  const data = JSON.parse(raw);
  pets = data.pets||[];
  gold = data.gold||0;
  selectedPet = null;
  fusionSlots = [null,null];
  washTarget = null;
  skillTarget = null;
  log(`存档读取成功! ${pets.length} 只宠物, ${gold} 金币`,"good");
  renderAll();
}

function resetGame() {
  if(!confirm('确定要重置所有数据吗?')) return;
  localStorage.removeItem('mxxy_save');
  pets = [];
  gold = 10000;
  selectedPet = null;
  fusionSlots = [null,null];
  washTarget = null;
  skillTarget = null;
  log("游戏已重置");
  renderAll();
}

// ==================== INIT ====================
// Auto-load or start fresh
const saved = localStorage.getItem('mxxy_save');
if(saved) {
  try {
    const data = JSON.parse(saved);
    pets = data.pets||[];
    gold = data.gold||10000;
    log(`自动读取存档: ${pets.length} 只宠物`,"good");
  } catch(e) { createStarterPets(5); }
} else {
  createStarterPets(5);
}

renderAll();
</script>
</body>
</html>
