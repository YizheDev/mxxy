<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MXXY 离线版 — 基于真实解码数据</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#080818;color:#c8c8d0}
.topbar{background:#0d0d28;border-bottom:1px solid #2a2a4a;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.topbar h1{font-size:18px;color:#ffd700}
.topbar .btns{display:flex;gap:8px}
.topbar button{padding:8px 16px;border:1px solid #444;border-radius:6px;background:#1a1a3e;color:#ccc;cursor:pointer;font-size:12px}
.topbar button:hover{background:#2a2a5e;border-color:#ffd700}
.main{max-width:1300px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{padding:10px 24px;border:1px solid #333;border-radius:8px 8px 0 0;background:#101028;color:#888;cursor:pointer;font-size:13px}
.tab.sel{background:#1a1a3e;color:#ffd700;border-color:#ffd700}
.panel{display:none}
.panel.on{display:block}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.pet-card{background:#101028;border:2px solid #2a2a4a;border-radius:12px;padding:16px;cursor:pointer;transition:all .2s;position:relative}
.pet-card:hover{border-color:#666}
.pet-card.sel{border-color:#ffd700;box-shadow:0 0 12px rgba(255,215,0,.2)}
.pet-card .name{font-size:17px;color:#ffd700;font-weight:bold;margin-bottom:3px}
.pet-card .sub{font-size:11px;color:#888;margin-bottom:10px}
.pet-card .stat-row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.pet-card .stat-row .sl{color:#888}
.pet-card .stat-row .sv{color:#4af;font-weight:bold}
.pet-card .skills-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.pet-card .skills-row .sk{display:flex;align-items:center;gap:3px;background:#1a1a3e;border:1px solid #333;border-radius:6px;padding:2px 8px;font-size:10px}
.pet-card .skills-row .sk img{width:18px;height:18px;image-rendering:pixelated}
.pet-card .actions{display:flex;gap:6px;margin-top:10px}
.pet-card .actions button{padding:5px 10px;border:1px solid #444;border-radius:6px;background:#1a1a3e;color:#ccc;cursor:pointer;font-size:11px;flex:1}
.pet-card .actions button.gold{background:#2a1a0a;border-color:#a80;color:#fa0}
.fusion-box{display:flex;gap:15px;align-items:center;justify-content:center;padding:20px;flex-wrap:wrap}
.f-slot{width:280px;min-height:200px;border:2px dashed #333;border-radius:16px;padding:16px;text-align:center;color:#555;display:flex;align-items:center;justify-content:center;flex-direction:column}
.f-slot.filled{border-style:solid;border-color:#555}
.f-plus{font-size:36px;color:#555}
.f-eq{font-size:36px;color:#ffd700}
.result-box{background:#121202;border:2px solid #332;border-radius:16px;padding:20px;text-align:center;min-width:260px}
.result-box h3{color:#ffd700;margin-bottom:10px}
button.big{padding:12px 30px;font-size:15px;border-radius:10px;cursor:pointer;margin:4px}
button.primary{background:linear-gradient(135deg,#2a1a0a,#3a2a0a);border:2px solid #a80;color:#fa0}
button.purple{background:linear-gradient(135deg,#1a0a2a,#2a1a3a);border:2px solid #a4f;color:#a4f}
.wash-area{text-align:center;padding:20px}
.skill-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:900px;margin:16px auto}
.skill-book{background:#101028;border:1px solid #333;border-radius:8px;padding:10px;text-align:center;cursor:pointer;width:90px;transition:all .2s}
.skill-book:hover{border-color:#ffd700}
.skill-book img{width:36px;height:36px;image-rendering:pixelated}
.skill-book .sid{font-size:9px;color:#555;margin-top:3px;word-break:break-all}
.log-box{background:#0a0a14;border:1px solid #2a2a4a;border-radius:8px;padding:12px;max-height:160px;overflow-y:auto;font-size:11px;color:#888;margin-top:20px}
.log-box .g{color:#4f4}.log-box .b{color:#f44}.log-box .w{color:#ffd700}
.info-note{background:#0a1a2a;border:1px solid #1a3a4a;border-radius:8px;padding:12px;margin:8px 0;font-size:11px;color:#8ac}
.info-note .title{color:#4af;font-weight:bold;margin-bottom:4px}
.warn-note{background:#2a1a0a;border:1px solid #4a3a1a;border-radius:8px;padding:12px;margin:8px 0;font-size:11px;color:#ca8}
.rare-tag{position:absolute;top:8px;right:8px;font-size:10px;padding:2px 6px;border-radius:4px}
.r0{background:#222;color:#888}.r1{background:#032;color:#4af;border:1px solid #046}
.r2{background:#203;color:#a4f;border:1px solid#406}.r3{background:#300;color:#f44;border:1px solid #600}
</style>
</head>
<body>

<div class="topbar">
  <h1>MXXY 离线版 — 数据来自真实 APK 解码 (38,135条目 / 30图标 / 22字段)</h1>
  <div class="btns">
    <button onclick="save()">💾 保存</button>
    <button onclick="load()">📂 读取</button>
    <button onclick="reset()">🔄 重置</button>
    <span style="color:#888;font-size:11px;margin-left:8px" id="goldUI">💰 金币: 0</span>
  </div>
</div>

<div class="main">
  <div class="tabs">
    <div class="tab sel" onclick="goTab('inv')">📦 宠物仓库</div>
    <div class="tab" onclick="goTab('fusion')">🧬 合宠融合</div>
    <div class="tab" onclick="goTab('wash')">✨ 资质洗炼</div>
    <div class="tab" onclick="goTab('skill')">📖 技能打书</div>
  </div>

  <div class="panel on" id="p-inv"></div>
  <div class="panel" id="p-fusion"></div>
  <div class="panel" id="p-wash"></div>
  <div class="panel" id="p-skill"></div>

  <div class="info-note">
    <div class="title">数据来源说明</div>
    所有宠物ID、字段名、技能图标均从 APK 资源文件真实解码。<br>
    宠物名称和具体数值仍在 RC4 加密中，此处使用 shape_id 编号替代名称。<br>
    数据结构完全遵循 infobeast.lua 定义的 22 字段。
  </div>

  <div class="log-box" id="log"></div>
</div>

<script>
// ============ ALL DATA FROM REAL APK DECODING ============

// REAL: 22 fields from infobeast.lua (decompressed ZZZ4/LZ4)
const FIELDS = [
  {id:"LIFE",cn:"生命值",cat:"属性"},
  {id:"TZZZ",cn:"体质资质",cat:"资质"},
  {id:"WGZZ",cn:"物攻资质",cat:"资质"},
  {id:"FGZZ",cn:"法攻资质",cat:"资质"},
  {id:"WFZZ",cn:"物防资质",cat:"资质"},
  {id:"SDZZ",cn:"速度资质",cat:"资质"},
  {id:"GROWUP",cn:"成长值",cat:"属性"},
  {id:"MERIT",cn:"资质总评",cat:"属性"},
  {id:"FIGHT_GRADE",cn:"战斗等级",cat:"属性"},
  {id:"NAME_IDX",cn:"名称索引",cat:"基础"},
  {id:"TYPE_IDX",cn:"类型索引",cat:"基础"},
  {id:"RARE_IDX",cn:"稀有度索引",cat:"基础"},
  {id:"DESC_IDX",cn:"描述索引",cat:"基础"},
  {id:"ORDER_IDX",cn:"图鉴编号",cat:"基础"},
  {id:"BASE_SKILLS_IDX",cn:"基础技能列表",cat:"技能"},
  {id:"SKILLS_IDX",cn:"可学技能列表",cat:"技能"},
  {id:"BIND_SKILL_IDX",cn:"绑定技能",cat:"技能"},
  {id:"FROM_IDX",cn:"进化来源",cat:"进化"},
  {id:"SUPERSUMMON_IDX",cn:"超级召唤",cat:"特殊"},
  {id:"UNIQUEDRUG_IDX",cn:"专属内丹",cat:"特殊"},
  {id:"BAODI1_IDX",cn:"保底参数1",cat:"特殊"},
  {id:"BAODI2_IDX",cn:"保底参数2",cat:"特殊"},
];

// REAL: 9 known shape_ids with actual resource paths from WPK/IDX
const REAL_SHAPES = [
  {id:4,model:"3dshapes/0004",portrait:"photo/portrait/4"},
  {id:8,model:"3dshapes/0008",portrait:null},
  {id:15,model:null,portrait:"photo/portrait/15"},
  {id:2131,model:null,portrait:null},
  {id:2139,model:null,portrait:"photo/portrait/2139"},
  {id:3014,model:null,portrait:"photo/portrait/3014"},
  {id:4058,model:"3dshapes/4058",portrait:null},
  {id:4068,model:"3dshapes/4068",portrait:null},
  {id:4085,model:"3dshapes/4085",portrait:null},
];

// REAL: 30 skill icons decoded from ASTC→PNG (loaded from manifest)
let SKILL_ICONS = [];

// ============ GAME STATE ============
let pets = [];
let gold = 10000;
let curTab = 'inv';
let selPet = null;
let fSlots = [null,null];
let wTarget = null;
let sTarget = null;

// ============ HELPERS ============
function r(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function wPick(items,weights){
  const t=Object.values(weights).reduce((a,b)=>a+b,0);
  let rn=Math.random()*t;
  for(const[k,w]of Object.entries(weights)){rn-=w;if(rn<=0)return k}
  return items[0];
}
function log(msg,c){const l=document.getElementById('log');l.innerHTML+=`<div class="${c||''}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;l.scrollTop=l.scrollHeight}

// ============ PET MODEL (22 fields from infobeast.lua) ============
function newPet(shapeId) {
  const s = REAL_SHAPES.find(x=>x.id===shapeId) || pick(REAL_SHAPES);
  const rar = wPick([0,1,2,3],{0:50,1:30,2:15,3:5});
  const lvl = r(1,10);
  const grow = rar===3?r(110,140):rar===2?r(95,120):rar===1?r(80,105):r(60,90);
  return {
    uid: Date.now().toString(36)+r(1000,9999),
    shape_id: s.id,        // REAL: shape_id from WPK
    model_path: s.model,    // REAL: model path from repository
    portrait_path: s.portrait, // REAL: portrait path
    rarity: rar,            // 0=N 1=R 2=SR 3=SSR
    level: lvl,
    LIFE: r(80,160),
    TZZZ: r(40,100), WGZZ: r(40,100), FGZZ: r(40,100), WFZZ: r(40,100), SDZZ: r(40,100),
    GROWUP: grow,
    MERIT: 0,
    FIGHT_GRADE: r(1,5),
    skills: [],  // skill icon hash IDs from decoded PNGs
    gen: 0,
    from: null,
  };
}

function calcStats(p){
  const g=p.GROWUP/100;
  return {
    HP: Math.floor(p.LIFE*g*(0.9+p.TZZZ/500)),
    ATK: Math.floor(p.WGZZ*g*(0.8+p.MERIT/500)),
    MATK: Math.floor(p.FGZZ*g*(0.8+p.MERIT/500)),
    DEF: Math.floor(p.WFZZ*g*(0.8+p.MERIT/500)),
    SPD: Math.floor(p.SDZZ*g*(0.9+p.MERIT/500)),
  };
}
function recalcMerit(p){p.MERIT=Math.floor((p.TZZZ+p.WGZZ+p.FGZZ+p.WFZZ+p.SDZZ)/5)}

// ============ STARTERS ============
function giveStarters(){
  pets=[];
  [4,8,15,2131,2139].forEach(sid=>{const p=newPet(sid);p.rarity=sid<=15?2:r(0,2);p.MERIT=r(60,90);pets.push(p)});
  // Give some skills (real icon hashes)
  if(SKILL_ICONS.length>0){
    pets[0].skills=[SKILL_ICONS[0].id,SKILL_ICONS[1].id];
    pets[1].skills=[SKILL_ICONS[2].id,SKILL_ICONS[3].id];
    pets[2].skills=[SKILL_ICONS[4].id];
  }
  pets.forEach(recalcMerit);
  log(`获得 ${pets.length} 只宠物 (shape_id: ${pets.map(p=>p.shape_id).join(', ')})`,'g');
}

// ============ FUSION (合宠) ============
function fuse(a,b){
  const cost=500;
  if(gold<cost){log('金币不足','b');return null}
  gold-=cost;
  const child=newPet(pick([a.shape_id,b.shape_id]));
  child.rarity=wPick([0,1,2,3],{
    0:20,1:35,
    2:a.rarity>=2||b.rarity>=2?30:15,
    3:a.rarity>=2&&b.rarity>=2?15:a.rarity>=2||b.rarity>=2?5:1
  });
  child.gen=Math.max(a.gen,b.gen)+1;
  // Inherit stats (weighted average + perturbation)
  ['LIFE','TZZZ','WGZZ','FGZZ','WFZZ','SDZZ','GROWUP'].forEach(k=>{
    child[k]=Math.floor((a[k]+b[k])/2*(0.85+Math.random()*0.3));
  });
  recalcMerit(child);
  child.from=[a.uid,b.uid];
  // Inherit skills: deduplicate, random select
  const all=[...new Set([...a.skills,...b.skills])];
  child.skills=all.sort(()=>Math.random()-0.5).slice(0,Math.min(all.length,r(2,4)));
  // Remove parents, add child
  pets=pets.filter(p=>p.uid!==a.uid&&p.uid!==b.uid);
  pets.push(child);
  log(`合宠: shape#${a.shape_id} + shape#${b.shape_id} = <b>shape#${child.shape_id}</b> G${child.gen}`,'w');
  return child;
}

// ============ WASH (洗炼) ============
function wash(p){
  const cost=p.rarity===3?1000:p.rarity===2?500:200;
  if(gold<cost){log('金币不足','b');return}
  gold-=cost;
  const improved=Math.random()<0.3;
  const oldM=p.MERIT;
  ['TZZZ','WGZZ','FGZZ','WFZZ','SDZZ'].forEach(k=>{
    p[k]=improved?Math.min(100,p[k]+r(1,8)):r(40,100);
  });
  p.GROWUP=improved?Math.min(150,p.GROWUP+r(1,5)):r(60,120);
  recalcMerit(p);
  const d=p.MERIT-oldM;
  log(`洗炼 shape#${p.shape_id}: 资质 ${d>=0?'+':''}${d} ${improved?'✨提升!':''}`,improved?'w':d>0?'g':'');
}

// ============ SKILL TEACH (打书) ============
function teach(p,iconId){
  const cost=300;
  if(gold<cost){log('金币不足','b');return}
  if(p.skills.includes(iconId)){log('已有此技能','b');return}
  gold-=cost;
  const max=p.rarity===3?6:p.rarity===2?4:p.rarity===1?3:2;
  if(p.skills.length>=max){p.skills.splice(r(0,p.skills.length-1),1)}
  p.skills.push(iconId);
  log(`打书 shape#${p.shape_id}: 学会技能 ${iconId.slice(0,8)}...`,'g');
}

// ============ RENDER ============
function renderAll(){
  document.getElementById('goldUI').textContent=`💰 金币: ${gold}`;
  rInv();rFusion();rWash();rSkill();
}

function petHTML(p,actions){
  const s=calcStats(p);
  const rn=['N','R','SR','SSR'][p.rarity];
  const sel=selPet&&selPet.uid===p.uid;
  return `<div class="pet-card ${sel?'sel':''}" onclick="clickPet('${p.uid}')">
    <span class="rare-tag r${p.rarity}">${rn}</span>
    <div class="name">Shape #${p.shape_id} ${p.gen>0?'⤿G'+p.gen:''}</div>
    <div class="sub">Lv.${p.level} | 成长${p.GROWUP} | 资质${p.MERIT} | 模型:${p.model_path||'✗'}</div>
    <div class="stat-row"><span class="sl">生命</span><span class="sv">${s.HP}</span></div>
    <div class="stat-row"><span class="sl">物攻</span><span class="sv">${s.ATK}</span></div>
    <div class="stat-row"><span class="sl">法攻</span><span class="sv">${s.MATK}</span></div>
    <div class="stat-row"><span class="sl">物防</span><span class="sv">${s.DEF}</span></div>
    <div class="stat-row"><span class="sl">速度</span><span class="sv">${s.SPD}</span></div>
    <div class="stat-row"><span class="sl">TZZZ/WGZZ/FGZZ/WFZZ/SDZZ</span><span class="sv">${p.TZZZ}/${p.WGZZ}/${p.FGZZ}/${p.WFZZ}/${p.SDZZ}</span></div>
    <div class="skills-row">${p.skills.map(sk=>{
      const icon=SKILL_ICONS.find(x=>x.id===sk);
      return icon?`<span class="sk"><img src="${icon.b64}" alt=""><span>${icon.id.slice(0,8)}</span></span>`:`<span class="sk">🔒</span>`;
    }).join('')}${p.skills.length===0?'<span style="color:#555;font-size:10px">无技能</span>':''}</div>
    ${actions?`<div class="actions">
      <button class="gold" onclick="event.stopPropagation();clickPet('${p.uid}');if(selPet){wTarget=selPet;goTab('wash')}">✨洗炼</button>
      <button onclick="event.stopPropagation();clickPet('${p.uid}');if(selPet)addFSlot(selPet)">🧬合宠</button>
    </div>`:''}
  </div>`;
}

function rInv(){
  const el=document.getElementById('p-inv');
  if(!pets.length){
    el.innerHTML=`<div style="text-align:center;padding:60px;color:#555"><p style="font-size:14px;margin-bottom:12px">🐣 仓库为空</p><button onclick="giveStarters();renderAll()" class="big primary">🎁 领取初始宠物 (基于真实 shape_id)</button></div>`;
    return;
  }
  el.innerHTML=`<div class="grid2">${pets.map(p=>petHTML(p,true)).join('')}</div>`;
}

function rFusion(){
  const el=document.getElementById('p-fusion');
  el.innerHTML=`<div class="fusion-box">
    <div class="f-slot ${fSlots[0]?'filled':''}" onclick="fSlots[0]=null;rFusion()">
      ${fSlots[0]?petHTML(fSlots[0],false).replace('sel',''):'<span>⬆️ 从仓库选宠</span>'}
    </div>
    <div class="f-plus">+</div>
    <div class="f-slot ${fSlots[1]?'filled':''}" onclick="fSlots[1]=null;rFusion()">
      ${fSlots[1]?petHTML(fSlots[1],false).replace('sel',''):'<span>⬆️ 从仓库选宠</span>'}
    </div>
    <div class="f-eq">=</div>
    <div class="result-box">
      <h3>🧬 合成预览</h3>
      ${fSlots[0]&&fSlots[1]?`
        <p style="color:#888;margin:6px 0">shape#${fSlots[0].shape_id} + shape#${fSlots[1].shape_id}</p>
        <p style="color:#888;font-size:11px">双亲属性加权平均 + 随机扰动<br>技能去重后随机遗传<br>稀有度有概率提升</p>
        <p style="color:#fa0;margin:8px 0">💰 500金币</p>
        <button class="big primary" onclick="doFuse()">开始合宠</button>
      `:'<p style="color:#555;font-size:12px">选两只宠物进行合宠</p>'}
    </div>
  </div>`;
}

function rWash(){
  const el=document.getElementById('p-wash');
  el.innerHTML=`<div class="wash-area">
    <h2 style="color:#ffd700">✨ 资质洗炼</h2>
    <p style="color:#888;margin:8px 0">重新随机 5 项资质 (TZZZ/WGZZ/FGZZ/WFZZ/SDZZ) + 成长值</p>
    <p style="color:#888;font-size:11px">基于 infobeast.lua 定义的真实字段结构</p>
    <div style="display:flex;justify-content:center;margin:16px">
      ${wTarget?petHTML(wTarget,false).replace('sel',''):'<div class="f-slot">⬆️ 从仓库选宠</div>'}
    </div>
    ${wTarget?`
    <p style="color:#fa0;margin:8px">💰 ${wTarget.rarity===3?1000:wTarget.rarity===2?500:200}金币/次 | 30%概率触发提升</p>
    <button class="big primary" onclick="wash(wTarget);renderAll()">✨ 洗炼×1</button>
    <button class="big purple" onclick="for(let i=0;i<5;i++)wash(wTarget);renderAll()">✨ 连洗×5</button>
    `:''}
  </div>`;
}

function rSkill(){
  const el=document.getElementById('p-skill');
  const max=sTarget?sTarget.rarity===3?6:sTarget.rarity===2?4:2:0;
  el.innerHTML=`<div style="text-align:center;padding:20px">
    <h2 style="color:#ffd700">📖 技能打书</h2>
    <p style="color:#888;margin:8px 0">用真实解码的技能图标 (30个) 给宠物学习技能</p>
    <div style="display:flex;justify-content:center;margin:16px">
      ${sTarget?petHTML(sTarget,false).replace('sel',''):'<div class="f-slot">⬆️ 从仓库选宠</div>'}
    </div>
    ${sTarget?`
    <p style="color:#888;font-size:11px">技能槽: ${sTarget.skills.length}/${max} | 💰 300金币/次</p>
    <h3 style="color:#4af;margin:16px 0">可用技能图标 (真实解码)</h3>
    <div class="skill-pool">
      ${SKILL_ICONS.filter(s=>!sTarget.skills.includes(s.id)).map(s=>`
        <div class="skill-book" onclick="teach(sTarget,'${s.id}');renderAll()">
          <img src="${s.b64}" alt="">
          <div class="sid">${s.id.slice(0,10)}</div>
        </div>
      `).join('')}
    </div>
    `:''}
  </div>`;
}

// ============ ACTIONS ============
function goTab(t){curTab=t;selPet=null;document.querySelectorAll('.tab').forEach((x,i)=>x.classList.toggle('sel',['inv','fusion','wash','skill'][i]===t));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));document.getElementById('p-'+t).classList.add('on');renderAll()}
function clickPet(uid){selPet=pets.find(p=>p.uid===uid);if(curTab==='fusion')addFSlot(selPet);if(curTab==='wash'){wTarget=selPet;goTab('wash')}if(curTab==='skill'){sTarget=selPet;goTab('skill')}renderAll()}
function addFSlot(p){if(!p)return;if(fSlots[0]&&fSlots[0].uid===p.uid){fSlots[0]=null;renderAll();return}if(fSlots[1]&&fSlots[1].uid===p.uid){fSlots[1]=null;renderAll();return}if(!fSlots[0])fSlots[0]=p;else if(!fSlots[1])fSlots[1]=p;goTab('fusion')}
function doFuse(){if(!fSlots[0]||!fSlots[1])return;const c=fuse(fSlots[0],fSlots[1]);fSlots=[null,null];if(c)selPet=c;renderAll()}

// ============ PERSISTENCE ============
function save(){localStorage.setItem('mxxy_v2',JSON.stringify({pets,gold,v:2}));log('已保存','g')}
function load(){
  const d=localStorage.getItem('mxxy_v2');
  if(!d){log('无存档','b');return}
  const s=JSON.parse(d);pets=s.pets;gold=s.gold||10000;
  selPet=null;fSlots=[null,null];wTarget=null;sTarget=null;
  log(`读取成功: ${pets.length}只宠物`,'g');renderAll();
}
function reset(){if(!confirm('重置?'))return;localStorage.removeItem('mxxy_v2');pets=[];gold=10000;selPet=null;fSlots=[null,null];wTarget=null;sTarget=null;log('已重置');renderAll()}

// ============ INIT ============
fetch('png/manifest.json').then(r=>r.json()).then(d=>{
  SKILL_ICONS=d.skills||[];
  log(`加载 ${SKILL_ICONS.length} 个真实技能图标`,'g');
  const saved=localStorage.getItem('mxxy_v2');
  if(saved){try{const s=JSON.parse(saved);pets=s.pets||[];gold=s.gold||10000;log(`读取存档: ${pets.length}只宠物`,'g')}catch(e){giveStarters()}}
  else giveStarters();
  renderAll();
}).catch(()=>{
  log('⚠️ 无法加载图标 (需HTTP服务器)','b');
  SKILL_ICONS=[];
  giveStarters();
  renderAll();
});
</script>
</body>
</html>
